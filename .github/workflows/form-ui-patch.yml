name: Apply FORM portal popup UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/form-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch popup UI and FORM status
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} match, found {count}")
              return text.replace(old, new, 1)

          html_path = Path('popup.html')
          html = html_path.read_text(encoding='utf-8')

          html = replace_once(
              html,
              '      gap: 8px;\n      padding: 8px 18px;\n      background: rgba(0, 0, 0, 0.2);\n      border-bottom: 1px solid var(--glass-border);',
              '      gap: 6px;\n      padding: 8px 12px;\n      background: rgba(0, 0, 0, 0.2);\n      border-bottom: 1px solid var(--glass-border);',
              'portal bar spacing'
          )

          html = replace_once(
              html,
              '      gap: 6px;\n      font-size: 11px;\n      color: var(--text-sub);\n      min-width: 0;\n    }\n\n    .portal-status .pdot {',
              '      gap: 5px;\n      flex: 1 1 auto;\n      min-width: 0;\n      font-size: 10.5px;\n      color: var(--text-sub);\n    }\n\n    #portal-text {\n      min-width: 0;\n      overflow: hidden;\n      text-overflow: ellipsis;\n      white-space: nowrap;\n    }\n\n    .portal-status .pdot {',
              'portal status layout'
          )

          html = replace_once(
              html,
              '    .portal-btns { display: flex; gap: 6px; flex-shrink: 0; }',
              '    .portal-btns { display: flex; gap: 4px; flex-shrink: 0; }',
              'portal button group spacing'
          )

          html = replace_once(
              html,
              '      padding: 5px 10px;\n      font-size: 11px;',
              '      padding: 5px 7px;\n      font-size: 10.5px;',
              'portal button sizing'
          )

          html = replace_once(
              html,
              '      transition: all 0.2s ease;\n    }\n    .portal-btn:hover {',
              '      transition: all 0.2s ease;\n      white-space: nowrap;\n    }\n    .portal-btn:hover {',
              'portal button nowrap'
          )

          html = replace_once(
              html,
              '      <button class="portal-btn" id="open-gms" title="Open the GMS login page">Open GMS</button>',
              '      <button class="portal-btn" id="open-gms" title="Open the GMS login page">Open GMS</button>\n      <button class="portal-btn" id="open-form" title="Open the FORM login page">Open Form</button>',
              'Open Form button'
          )

          html_path.write_text(html, encoding='utf-8')

          js_path = Path('popup.js')
          js = js_path.read_text(encoding='utf-8')

          js = replace_once(
              js,
              '  "form.gedenlines.com": { logoutPath: "/Account/Logout", loginPath: "/Account/Logon", label: "FORM", dotClass: "erp" }',
              '  "form.gedenlines.com": { logoutPath: "/Account/Logout", loginPath: "/Account/Logon", label: "Geden", dotClass: "erp" }',
              'FORM portal label'
          )

          js = replace_once(
              js,
              '  gms: "https://gms.gedenlines.com/login"\n};',
              '  gms: "https://gms.gedenlines.com/login",\n  form: "https://form.gedenlines.com/Account/Logon"\n};',
              'FORM quick link config'
          )

          js = replace_once(
              js,
              "  openGmsBtn.addEventListener('click', () => chrome.tabs.create({ url: PORTALS.gms }));",
              "  openGmsBtn.addEventListener('click', () => chrome.tabs.create({ url: PORTALS.gms }));\n  document.getElementById('open-form').addEventListener('click', () => chrome.tabs.create({ url: PORTALS.form }));",
              'Open Form click handler'
          )

          js_path.write_text(js, encoding='utf-8')

      - name: Validate JavaScript and patch
        run: |
          node --check popup.js
          grep -q 'id="open-form"' popup.html
          grep -q 'label: "Geden"' popup.js
          grep -q 'form: "https://form.gedenlines.com/Account/Logon"' popup.js
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add popup.html popup.js
          git commit -m "feat: add FORM quick access to popup"
          git push
